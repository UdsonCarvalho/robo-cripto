name: Laboratorio (testa estrategias 24h)

# Três testadores em turnos de 8 h (Lia 0h-8h, Davi 8h-16h, Nina 16h-24h, horário de Brasília).
# SÓ TESTA: não usa as chaves da corretora e não envia ordens.
on:
  schedule:
    - cron: "41 * * * *"     # de hora em hora
  workflow_dispatch:

concurrency:
  group: laboratorio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testar o próximo lote de estratégias
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python laboratorio.py | tee lab.txt; { echo '```'; cat lab.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
