name: Backtest cripto cruzamento (simulado)

on:
  push:
    paths: ["backtests/cripto_cruzamento/bt.py", ".github/workflows/backtest-cripto.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backtests/cripto_cruzamento
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r ../../requirements.txt
      - run: python bt.py
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-cripto
          path: backtests/cripto_cruzamento/relatorio.md
